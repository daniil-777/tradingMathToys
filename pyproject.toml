[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "financeai"
dynamic = ["version"]
description = "Causal event-driven replay and strategy research for spot, linear, and inverse markets."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Daniil Emtsev" }]
keywords = ["backtesting", "market-microstructure", "quantitative-research", "event-driven", "trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
# Compiled kernels. The core works without it (pure-Python fallback), only slower.
fast = ["numba>=0.61"]
# Matplotlib figures for reports; never imported by the numerical core.
report = ["matplotlib>=3.9"]
# Offline HTML replay explorer; the numerical core does not import Plotly.
interactive = ["plotly>=6,<7"]
# Optional headless UI regression tooling (not needed to create or view reports).
browser-test = ["playwright>=1.49,<2"]
# Local research job API (financeai.service; full_library profile); importing financeai never imports it.
# service/app.py also imports starlette (ASGI middleware types, the HTTPException handler) and anyio
# (thread offload) directly, so they are declared rather than left to FastAPI's own requirements.
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8", "httpx>=0.27", "starlette>=0.40", "anyio>=4.0"]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
]

[project.urls]
Repository = "https://github.com/daniil-777/tradingMathToys"
Documentation = "https://github.com/daniil-777/tradingMathToys/tree/main/docs"
Issues = "https://github.com/daniil-777/tradingMathToys/issues"

[project.scripts]
financeai = "financeai.cli:main"

[tool.hatch.version]
path = "src/financeai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/financeai"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "examples", "docs", "scripts",
                "README.md", "CONTRIBUTING.md", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# uv may set the macOS "hidden" flag on .venv/*.pth, which CPython 3.12 then skips;
# keep tests importable from the source tree regardless.
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: touches full market-data files or long replays",
    "data: requires external market data or local research artifacts",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PERF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["financeai"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["numba", "numba.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
