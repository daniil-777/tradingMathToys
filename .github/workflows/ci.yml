name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,fast,report,interactive,api]'
      - run: python -m ruff check src tests examples scripts
      - run: python -m mypy src
      - run: python scripts/check_docs.py

  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: numpy-only
            extras: dev
            disable-jit: '1'
          - os: ubuntu-latest
            mode: all-extras
            extras: dev,fast,report,interactive,api
            disable-jit: '0'
          - os: macos-latest
            mode: all-extras
            extras: dev,fast,report,interactive,api
            disable-jit: '0'
    env:
      FINANCEAI_DISABLE_JIT: ${{ matrix.disable-jit }}
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - name: Configure runtime caches
        shell: bash
        run: |
          echo "MPLCONFIGDIR=$RUNNER_TEMP/matplotlib" >> "$GITHUB_ENV"
          echo "NUMBA_CACHE_DIR=$RUNNER_TEMP/numba" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[${{ matrix.extras }}]'
      - run: python -m pytest -q -m 'not slow and not data'
      - run: python examples/market_replay.py --out '${{ runner.temp }}/quickstart'

  browser:
    name: Offline report (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FINANCEAI_DISABLE_JIT: '1'
      FINANCEAI_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,interactive,browser-test]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/reporting/test_replay_browser.py
      - run: python examples/replay_report.py --out '${{ runner.temp }}/replay.html'

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Install and run the wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -I -m financeai --version
          "$RUNNER_TEMP/wheel-env/bin/python" -I "$GITHUB_WORKSPACE/examples/market_replay.py" --out wheel-example
      - name: Verify the installed interactive report and bundled template
        shell: bash
        run: |
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install 'plotly>=6,<7'
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -I "$GITHUB_WORKSPACE/examples/replay_report.py" --out wheel-replay.html
