name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,fast,report,api]'
      - run: python -m ruff check src tests examples scripts
      - run: python -m mypy src
      - run: python scripts/check_docs.py

  tests:
    name: Tests (${{ matrix.os }}, ${{ matrix.mode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            mode: numpy-only
            extras: dev
            disable-jit: '1'
          - os: ubuntu-latest
            mode: all-extras
            extras: dev,fast,report,api
            disable-jit: '0'
          - os: macos-latest
            mode: all-extras
            extras: dev,fast,report,api
            disable-jit: '0'
    env:
      FINANCEAI_DISABLE_JIT: ${{ matrix.disable-jit }}
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      NUMBA_CACHE_DIR: ${{ runner.temp }}/numba
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[${{ matrix.extras }}]'
      - run: python -m pytest -q -m 'not slow and not data'
      - run: python examples/market_replay.py --out '${{ runner.temp }}/quickstart'

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Install and run the wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/python" -I -m financeai --version
          "$RUNNER_TEMP/wheel-env/bin/python" -I "$GITHUB_WORKSPACE/examples/market_replay.py" --out wheel-example
